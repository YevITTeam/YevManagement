# Chay tren Windows Server co Docker Engine (Windows containers, khong phai Linux/WSL2) - xem
# docs/deploy-config/docker-deploy-guide.md truoc khi dung file nay lan dau.
#
# Build context la GOC repo nay (noi dat file docker-compose.yml), vi 2 Dockerfile can COPY ca
# yev-backend/ va yev-frontend/out/ + docs/deploy-config/config-fe/web.config.
#
# Truoc `docker compose build`: da chay `pnpm build` trong yev-frontend/ (frontend.Dockerfile
# khong tu build Next.js). Xem docker/build-and-run.ps1 de lam ca 2 buoc tu dong.
#
# appsettings.json that (co connection string/JWT secret/SMTP) KHONG nam trong repo/image - sua
# duong dan volume ".env.docker" hoac bien $APPSETTINGS_PATH ben duoi cho khop noi luu tren server.

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: yevmanagement-backend:latest
    container_name: yevmanagement-backend
    ports:
      - "8080:8080"
    volumes:
      # File appsettings.json that cua production, luu ngoai repo tren server (vd D:\Deploy\appsettings.json).
      - ${APPSETTINGS_PATH:-D:/Deploy/appsettings.json}:C:/app/appsettings.json:ro
      - ${BACKEND_LOGS_PATH:-D:/Deploy/logs}:C:/app/logs
    # Can cho Negotiate/NTLM (/windows-login) xac thuc duoc voi Active Directory ma KHONG phai
    # domain-join container. File credspec nay phai tao truoc bang New-ADServiceAccount +
    # New-CredentialSpec (xem docs/deploy-config/docker-deploy-guide.md muc gMSA).
    security_opt:
      - "credentialspec=file://yevmanagement-be.json"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: yevmanagement-frontend:latest
    container_name: yevmanagement-frontend
    ports:
      - "8000:80"
    restart: unless-stopped
